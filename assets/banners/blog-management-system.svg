<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Blog Management System</title>
  <desc id="desc">A modern editorial workspace illustration for a Laravel, Inertia and Vue blog application.</desc>
  <defs>
